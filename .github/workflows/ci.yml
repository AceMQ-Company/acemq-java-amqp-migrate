# Build and test on every JDK this tool promises to run on. Nothing here calls a model: the
# model step is tested against a scripted model and a fake Ollama on loopback.
name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: build on JDK ${{ matrix.java }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        java: ['17', '21', '25']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
          cache: maven
      - name: Build and test
        run: mvn -B --no-transfer-progress clean verify
      - name: The runnable jar reports on the sample
        run: |
          java -jar target/acemq-java-amqp-migrate-*-all.jar src/test/resources/sample --no-model > report.md
          grep -q '^## Step by step' report.md
      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: reports-jdk${{ matrix.java }}
          path: '**/target/surefire-reports/**'
          retention-days: 7
